<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="frameShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Outer border -->
  <rect x="20" y="20" width="984" height="984" rx="28" fill="none" stroke="#FFFFFF" stroke-width="24" filter="url(#frameShadow)"/>
  
  <!-- Sleek Aerospace Cyan Ticks -->
  <path d="M 52 110 L 52 52 L 110 52" fill="none" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 972 110 L 972 52 L 914 52" fill="none" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 52 914 L 52 972 L 110 972" fill="none" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 972 914 L 972 972 L 914 972" fill="none" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Top Mission Telemetry Bar -->
  <rect x="36" y="36" width="952" height="42" rx="12" fill="#0A0F1D" fill-opacity="0.9"/>
  <circle cx="56" cy="57" r="4" fill="#00F0FF"/>
  <text x="70" y="62" font-family="'Geist', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="3">GISTDA • THAILAND SPACE EXPO 2026</text>
  <text x="968" y="62" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="end" letter-spacing="1">THEOS-2 ORBIT • 620 KM SSO</text>

  <!-- Bottom Keepsake Bar -->
  <rect x="36" y="930" width="952" height="58" rx="14" fill="#0A0F1D" fill-opacity="0.92"/>
  <text x="64" y="965" font-family="'Geist', 'Prompt', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="2">MISSION AVATAR PASS</text>
  <text x="320" y="965" font-family="'Geist Mono', monospace" font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="1">LAT 13.7268° N • LON 100.5103° E</text>
  <text x="960" y="965" font-family="'Geist Mono', monospace" font-size="13" font-weight="700" fill="#00F0FF" text-anchor="end" letter-spacing="2">TRUE ICON HALL</text>
</svg>
