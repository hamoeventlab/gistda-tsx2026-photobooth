<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="patchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="theosShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2563EB" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Mission Shield Base -->
  <path d="M 100 12 L 180 40 L 180 115 C 180 155 100 188 100 188 C 100 188 20 155 20 115 L 20 40 Z" fill="url(#patchBg)" stroke="#38BDF8" stroke-width="4" filter="url(#theosShadow)"/>
  <path d="M 100 22 L 170 47 L 170 112 C 170 146 100 176 100 176 C 100 176 30 146 30 112 L 30 47 Z" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <!-- Satellite Silhouette & Horizon Arc -->
  <path d="M 40 120 Q 100 70 160 120" stroke="#00F0FF" stroke-width="2.5" fill="none" stroke-dasharray="4,3"/>
  <circle cx="100" cy="85" r="7" fill="#F59E0B"/>
  <path d="M 94 85 L 75 80 L 77 92 Z" fill="#38BDF8"/>
  <path d="M 106 85 L 125 80 L 123 92 Z" fill="#38BDF8"/>

  <!-- Text Header -->
  <text x="100" y="58" font-family="'Geist', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">THEOS-2</text>
  <text x="100" y="72" font-family="'Geist Mono', monospace" font-size="8" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="2">MISSION SPEC</text>
  
  <!-- Thai Flag Mini Stripe -->
  <rect x="75" y="135" width="50" height="3" fill="#EF4444"/>
  <rect x="75" y="138" width="50" height="2" fill="#FFFFFF"/>
  <rect x="75" y="140" width="50" height="4" fill="#1E3A8A"/>
  <rect x="75" y="144" width="50" height="2" fill="#FFFFFF"/>
  <rect x="75" y="146" width="50" height="3" fill="#EF4444"/>

  <text x="100" y="162" font-family="'Geist Mono', monospace" font-size="8" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="2">TSX 2026</text>
</svg>
