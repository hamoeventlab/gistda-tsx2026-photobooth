<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="gistdaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A1128" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Badge Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#gistdaGlow)" stroke="#00F0FF" stroke-width="4" filter="url(#badgeShadow)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Orbit Ring -->
  <ellipse cx="100" cy="100" rx="72" ry="24" fill="none" stroke="#38BDF8" stroke-width="2.5" transform="rotate(-25 100 100)"/>
  <circle cx="45" cy="80" r="4.5" fill="#00F0FF"/>
  
  <!-- Center Satellite / Space Icon -->
  <path d="M 85 85 L 115 115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <rect x="92" y="92" width="16" height="16" rx="3" fill="#2563EB" stroke="#00F0FF" stroke-width="2"/>
  <line x1="78" y1="78" x2="88" y2="88" stroke="#38BDF8" stroke-width="2"/>
  <rect x="70" y="70" width="14" height="10" rx="1.5" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="116" y="120" width="14" height="10" rx="1.5" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Agency Text -->
  <text x="100" y="52" font-family="'Geist', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">GISTDA</text>
  <text x="100" y="152" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="2">THAILAND SPACE</text>
  <text x="100" y="165" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1">EXPO 2026</text>
</svg>
