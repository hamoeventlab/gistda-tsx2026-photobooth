  <!-- Frame bridge & sides -->
  <path d="M 5 22 L 30 18 L 70 20 L 80 25 L 90 20 L 130 18 L 155 22 L 150 28 L 135 24 L 95 26 L 80 32 L 65 26 L 25 24 L 10 28 Z" fill="#111115" stroke="#00F0FF" stroke-width="1.5"/>
